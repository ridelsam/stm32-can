# NUCLEO-F446RE with onboard ST-Link converted to J-Link firmware.
source [find interface/jlink.cfg]
transport select swd
source [find target/stm32f4x.cfg]

# Verified probe connection at 1 MHz; independent of CPU/CAN bit timing.
adapter speed 1000

# The bundled STM32F4 target script changes adapter speed during reset and
# programs a temporary PLL configuration. Override both events to keep the
# proven SWD speed and use the MCU's default reset clock during programming.
$_TARGETNAME configure -event reset-start {
    adapter speed 1000
}
$_TARGETNAME configure -event reset-init {
    adapter speed 1000
}
